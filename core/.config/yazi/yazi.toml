# ==============================================================================
# Yazi Configuration — Omarchy Quattro Core Dotfiles
# ==============================================================================

[mgr]
ratio = [1, 4, 3]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 1200
max_height = 1500
cache_dir = ""
image_filter = "triangle"
image_quality = 80
sixel_fraction = 15

[opener]
edit = [
    { run = 'omarchy-launch-editor --inline "$@"', block = true, desc = "Editor", for = "unix" }
]
open = [
    { run = 'xdg-open "$@"', desc = "Open", for = "unix" }
]

[open]
rules = [
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "application/json", use = [ "edit", "open" ] },
    { mime = "application/*xml", use = [ "edit", "open" ] },
    { mime = "application/javascript", use = [ "edit", "open" ] },
    { mime = "application/x-sh", use = [ "edit", "open" ] },
    { mime = "application/x-shellscript", use = [ "edit", "open" ] },
    { name = "*", use = [ "open" ] }
]
