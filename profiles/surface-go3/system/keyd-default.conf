# Surface Go 3 Denial-only keyd configuration (macOS-style text editing)
# Managed by profiles/surface-go3/setup.sh.
# keyd.service stays disabled at boot and is started/stopped automatically
# only during Denial sessions via ~/.config/systemd/user/denial-keyd.service.

[ids]
*
# Exclude our virtual double-tap-to-wake device (KEY_WAKEUP)
-1d6b:0104

[meta]
left = home
right = end
up = C-home
down = C-end
z = C-z
backspace = macro(S-home backspace)
delete = macro(S-end delete)

[meta+shift]
left = S-home
right = S-end
up = C-S-home
down = C-S-end
z = C-S-z

[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[alt+shift]
left = C-S-left
right = C-S-right
